<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEXTRA - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #151A23;
            --bg-input: #1E2530;
            --green: #00ff88;
            --red: #FF3B30;
            --text-light: #FFFFFF;
            --text-muted: #8E8E93;
            --border-color: #2A3241;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); }
        
        /* LAYAR LOADING AKSES */
        #loadingScreen { position: fixed; width: 100%; height: 100vh; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; gap: 10px; font-weight: bold; }
        
        /* HEADER */
        header { background: var(--bg-card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .logo { color: var(--green); font-size: 18px; font-weight: 800; letter-spacing: 1px; }
        .btn-logout { background: rgba(255,59,48,0.1); color: var(--red); border: 1px solid var(--red); padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* TABS NAVIGATION */
        .tabs { display: flex; overflow-x: auto; background: var(--bg-card); padding: 10px 15px; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab-btn.active { background: rgba(0, 255, 136, 0.1); color: var(--green); border-color: var(--green); }

        /* CONTENT AREA */
        .content-section { display: none; padding: 15px; }
        .content-section.active { display: block; }
        
        /* DATA CARDS */
        .data-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-muted); border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
        .card-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; align-items: center; text-align: right; }
        .card-val { font-weight: bold; color: #fff; margin-left: 10px; }
        
        /* ACTION BUTTONS */
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-acc { flex: 1; background: var(--green); color: #000; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-reject { flex: 1; background: transparent; color: var(--red); border: 1px solid var(--red); padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

        /* DASHBOARD STATS & FILTER BOX */
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-input); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
        .stat-card h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-card p { font-size: 16px; font-weight: bold; color: var(--green); }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 150px; }
        .search-box input, .filter-box select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: white; outline: none; font-size: 13px; }
        .search-box input:focus, .filter-box select:focus { border-color: var(--green); }
        .filter-box { flex: 1; min-width: 120px; }

        /* MODAL EDIT USER */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-header h3 { font-size: 16px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-input); color: white; }
        .btn-save { width: 100%; background: var(--green); color: black; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-reset-pass { width: 100%; background: transparent; color: #FF9500; border: 1px solid #FF9500; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <i class="fa-solid fa-shield-halved" style="font-size: 40px; color: var(--green);"></i>
        <span>Memverifikasi Akses Admin...</span>
    </div>

    <div id="adminPanel" style="display: none;">
        <header>
            <div class="logo">VEXTRA ADMIN</div>
            <button class="btn-logout" onclick="logoutAdmin()"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tabDashboard', this); loadDashboard()">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('tabDeposit', this); loadDeposits()">Deposit</button>
            <button class="tab-btn" onclick="switchTab('tabWithdraw', this); loadWithdrawals()">Penarikan</button>
            <button class="tab-btn" onclick="switchTab('tabUsers', this); loadUsers()">Data Pengguna</button>
        </div>

        <!-- SECTION DASHBOARD -->
        <div id="tabDashboard" class="content-section active">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Ringkasan Sistem</h3>
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h4>Total Saldo User</h4>
                    <p id="statTotalSaldo">Rp 0</p>
                </div>
                <div class="stat-card">
                    <h4>Total Pengguna</h4>
                    <p id="statTotalUsers">0</p>
                </div>
                <div class="stat-card">
                    <h4>Deposit Pending</h4>
                    <p id="statDepoPending">0</p>
                </div>
                <div class="stat-card">
                    <h4>Withdraw Pending</h4>
                    <p id="statWdPending">0</p>
                </div>
            </div>
        </div>

        <!-- SECTION: DEPOSIT -->
        <div id="tabDeposit" class="content-section">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Riwayat Deposit</h3>
            <div class="filter-row">
                <div class="filter-box" style="flex: 100%;">
                    <select id="filterDepoStatus" onchange="loadDeposits()">
                        <option value="Pending">Status: Pending</option>
                        <option value="Sukses">Status: Sukses</option>
                        <option value="Ditolak">Status: Ditolak</option>
                        <option value="Semua">Semua Status</option>
                    </select>
                </div>
            </div>
            <div id="listDeposits"></div>
        </div>

        <!-- SECTION: WITHDRAWAL -->
        <div id="tabWithdraw" class="content-section">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Riwayat Penarikan</h3>
            <div class="filter-row">
                <div class="filter-box" style="flex: 100%;">
                    <select id="filterWdStatus" onchange="loadWithdrawals()">
                        <option value="Pending">Status: Pending</option>
                        <option value="Sukses">Status: Sukses</option>
                        <option value="Ditolak">Status: Ditolak</option>
                        <option value="Semua">Semua Status</option>
                    </select>
                </div>
            </div>
            <div id="listWithdrawals"></div>
        </div>

        <!-- SECTION: DATA USERS & PENCARIAN -->
        <div id="tabUsers" class="content-section">
            <h3 style="margin-bottom: 15px; font-size: 16px;">Manajemen Pengguna</h3>
            
            <div class="filter-row">
                <div class="search-box" style="flex: 100%;">
                    <input type="text" id="searchInput" placeholder="Cari nama, email, UID..." onkeyup="filterUsers()">
                </div>
                <div class="filter-box">
                    <select id="sortUser" onchange="filterUsers()">
                        <option value="terbaru">Sort: Default</option>
                        <option value="saldo_tinggi">Saldo: Tertinggi</option>
                        <option value="saldo_rendah">Saldo: Terendah</option>
                        <option value="nama_az">Nama: A-Z</option>
                    </select>
                </div>
                <div class="filter-box">
                    <select id="filterStatusUser" onchange="filterUsers()">
                        <option value="all">Status: Semua</option>
                        <option value="active">Status: Aktif</option>
                        <option value="banned">Status: Dibekukan</option>
                    </select>
                </div>
            </div>

            <div id="listUsers"></div>
        </div>
    </div>

    <!-- MODAL EDIT PENGGUNA -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pengaturan Akun</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <input type="hidden" id="editUid">
            
            <div class="form-group">
                <label>UID Pengguna</label>
                <input type="text" id="editUidView" disabled style="opacity: 0.6; font-size: 11px;">
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="editNama">
            </div>
            <div class="form-group">
                <label>Email Pengguna</label>
                <input type="text" id="editEmail" disabled style="opacity: 0.6;">
            </div>
            <div class="form-group">
                <label>Saldo (IDR) - <small>Bisa diubah manual</small></label>
                <input type="number" id="editSaldo">
            </div>
            <div class="form-group">
                <label>Status Akun</label>
                <select id="editStatusAkun">
                    <option value="active">Aktif (Normal)</option>
                    <option value="banned">Dibekukan (Banned)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Role / Akses</label>
                <select id="editRole">
                    <option value="user">User Biasa</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            
            <button class="btn-save" onclick="saveUserData()">Simpan Perubahan</button>
            <button class="btn-reset-pass" onclick="sendResetPassword()"><i class="fa-solid fa-key"></i> Kirim Link Reset Password</button>
            
            <!-- TAMBAHAN: Tombol Hapus Akun -->
            <button class="btn-reject" style="width: 100%; margin-top: 10px; padding: 12px; border-color: #FF3B30; color: #FF3B30;" onclick="hapusPengguna()">
                <i class="fa-solid fa-trash"></i> Hapus Data Pengguna
            </button>
        </div>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        // TAMBAHAN: deleteDoc ditambahkan pada import di bawah ini
        import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection, getDocs, query, where, runTransaction } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvHkXznxTpdVcFMlp0pFgFYEc82Mk93jE",
            authDomain: "vextra-b30c6.firebaseapp.com",
            projectId: "vextra-b30c6",
            storageBucket: "vextra-b30c6.firebasestorage.app",
            messagingSenderId: "959668718026",
            appId: "1:959668718026:web:1b4989300a887e42dea733"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allUsersData = []; 

        const formatIDR = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "admin") {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadDashboard(); 
                } else {
                    alert("Akses Ditolak! Anda bukan Admin.");
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        window.switchTab = (tabId, btn) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        };

        window.logoutAdmin = async () => {
            await signOut(auth);
            window.location.href = "index.html";
        };

        window.loadDashboard = async () => {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                let totalSaldo = 0;
                let totalUsers = 0;
                usersSnap.forEach(doc => {
                    totalUsers++;
                    totalSaldo += (doc.data().saldo || 0);
                });
                
                const qDepo = query(collection(db, "deposits"), where("status", "==", "Pending"));
                const depoSnap = await getDocs(qDepo);
                
                const qWd = query(collection(db, "withdrawals"), where("status", "==", "Pending"));
                const wdSnap = await getDocs(qWd);

                document.getElementById('statTotalSaldo').innerText = formatIDR(totalSaldo);
                document.getElementById('statTotalUsers').innerText = totalUsers;
                document.getElementById('statDepoPending').innerText = depoSnap.size;
                document.getElementById('statWdPending').innerText = wdSnap.size;
            } catch(e) { console.error("Error load dashboard:", e); }
        };

        window.loadDeposits = async () => {
            const container = document.getElementById('listDeposits');
            const statusFilter = document.getElementById('filterDepoStatus').value;
            container.innerHTML = '<div class="empty-state">Memuat data...</div>';
            
            try {
                let q;
                if(statusFilter === "Semua") {
                    q = collection(db, "deposits");
                } else {
                    q = query(collection(db, "deposits"), where("status", "==", statusFilter));
                }

                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox" style="font-size:30px; margin-bottom:10px;"></i><br>Tidak ada data deposit ${statusFilter}.</div>`;
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    const tanggal = data.tanggal ? data.tanggal.toDate().toLocaleString('id-ID') : '-';
                    
                    let statusColor = data.status === 'Pending' ? '#FF9500' : (data.status === 'Sukses' ? 'var(--green)' : 'var(--red)');
                    
                    container.innerHTML += `
                        <div class="data-card">
                            <div class="card-header">
                                <span>${tanggal}</span>
                                <span style="color:${statusColor}; font-weight:bold;">${data.status}</span>
                            </div>
                            <div class="card-row"><span>Nama User</span><span class="card-val">${data.nama}</span></div>
                            <div class="card-row"><span>UID User</span><span class="card-val" style="font-size:10px; color:var(--text-muted);">${data.uid}</span></div>
                            <div class="card-row"><span>Metode</span><span class="card-val">${data.metode}</span></div>
                            <div class="card-row"><span>Nominal</span><span class="card-val" style="color:var(--green); font-size:16px;">${formatIDR(data.nominal)}</span></div>
                            ${data.alasan_tolak ? `<div class="card-row"><span style="color:var(--red);">Alasan Tolak</span><span class="card-val" style="color:var(--red); font-size:11px;">${data.alasan_tolak}</span></div>` : ''}
                            
                            ${data.status === 'Pending' ? `
                            <div class="action-group">
                                <button class="btn-reject" onclick="tolakRequest('deposits', '${documento.id}')">Tolak</button>
                                <button class="btn-acc" onclick="accDeposit('${documento.id}', '${data.uid}', ${data.nominal})"><i class="fa-solid fa-check"></i> Setujui</button>
                            </div>` : ''}
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        };

        window.accDeposit = async (docId, userUid, nominal) => {
            if(!confirm(`Setujui Deposit sebesar ${formatIDR(nominal)}? Saldo user akan bertambah otomatis.`)) return;
            
            try {
                const userRef = doc(db, "users", userUid);
                const depositRef = doc(db, "deposits", docId);

                await runTransaction(db, async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw "User tidak ditemukan!";
                    
                    const currentSaldo = userSnap.data().saldo || 0;
                    
                    transaction.update(userRef, { 
                        saldo: currentSaldo + nominal,
                        has_deposited: true 
                    });
                    transaction.update(depositRef, { status: "Sukses" });
                });
                
                alert("Berhasil! Deposit disetujui dan saldo user bertambah.");
                loadDeposits(); 
                loadDashboard(); 
            } catch(e) { alert("Terjadi kesalahan: " + e); }
        };

        window.loadWithdrawals = async () => {
            const container = document.getElementById('listWithdrawals');
            const statusFilter = document.getElementById('filterWdStatus').value;
            container.innerHTML = '<div class="empty-state">Memuat data...</div>';
            
            try {
                let q;
                if(statusFilter === "Semua") {
                    q = collection(db, "withdrawals");
                } else {
                    q = query(collection(db, "withdrawals"), where("status", "==", statusFilter));
                }

                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox" style="font-size:30px; margin-bottom:10px;"></i><br>Tidak ada data penarikan ${statusFilter}.</div>`;
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    const tanggal = data.tanggal ? data.tanggal.toDate().toLocaleString('id-ID') : '-';
                    
                    let statusColor = data.status === 'Pending' ? '#FF9500' : (data.status === 'Sukses' ? 'var(--green)' : 'var(--red)');
                    
                    container.innerHTML += `
                        <div class="data-card" style="${data.status === 'Pending' ? 'border-left: 3px solid #FF9500;' : ''}">
                            <div class="card-header">
                                <span>${tanggal}</span>
                                <span style="color:${statusColor}; font-weight:bold;">${data.status}</span>
                            </div>
                            <div class="card-row"><span>Nama User</span><span class="card-val">${data.nama}</span></div>
                            <div class="card-row"><span>UID User</span><span class="card-val" style="font-size:10px; color:var(--text-muted);">${data.uid}</span></div>
                            <div class="card-row"><span>Rekening</span><span class="card-val">${data.bank || '-'} (${data.norek || '-'})</span></div>
                            <div class="card-row"><span>A.N Rekening</span><span class="card-val">${data.atas_nama || '-'}</span></div>
                            
                            <div class="card-row" style="margin-top:10px; border-top:1px dashed var(--border-color); padding-top:10px;">
                                <span>Nominal Tarik</span><span class="card-val" style="color:var(--red); font-size:16px;">${formatIDR(data.nominal)}</span>
                            </div>
                            ${data.alasan_tolak ? `<div class="card-row"><span style="color:var(--red);">Alasan Tolak</span><span class="card-val" style="color:var(--red); font-size:11px;">${data.alasan_tolak}</span></div>` : ''}

                            ${data.status === 'Pending' ? `
                            <div class="action-group">
                                <button class="btn-reject" onclick="tolakRequest('withdrawals', '${documento.id}')">Tolak</button>
                                <button class="btn-acc" onclick="accWithdrawal('${documento.id}', '${data.uid}', ${data.nominal})"><i class="fa-solid fa-check"></i> Potong & Setujui</button>
                            </div>` : ''}
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        };

        window.accWithdrawal = async (docId, userUid, nominal) => {
            if(!confirm(`Setujui Penarikan ${formatIDR(nominal)}? Ini akan memotong saldo user.`)) return;
            
            try {
                const userRef = doc(db, "users", userUid);
                const wdRef = doc(db, "withdrawals", docId);
                
                await runTransaction(db, async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    if (!userSnap.exists()) throw "User tidak ditemukan!";
                    
                    const currentSaldo = userSnap.data().saldo || 0;
                    
                    if(currentSaldo < nominal) {
                        throw "Saldo user saat ini tidak mencukupi untuk penarikan ini.";
                    }
                    
                    transaction.update(userRef, { saldo: currentSaldo - nominal });
                    transaction.update(wdRef, { status: "Sukses" });
                });
                
                alert("Berhasil! Penarikan disetujui dan saldo terpotong.");
                loadWithdrawals();
                loadDashboard(); 
            } catch(e) { alert("GAGAL: " + e); }
        };

        window.tolakRequest = async (koleksi, docId) => {
            const alasan = prompt("Masukkan alasan penolakan (kosongkan jika tidak ada):");
            
            if(alasan !== null) { 
                try {
                    await updateDoc(doc(db, koleksi, docId), { 
                        status: "Ditolak",
                        alasan_tolak: alasan || "Tidak ada alasan spesifik"
                    });
                    alert("Permintaan telah ditolak.");
                    if(koleksi === 'deposits') loadDeposits();
                    if(koleksi === 'withdrawals') loadWithdrawals();
                } catch(e) { alert("Gagal menolak: " + e.message); }
            }
        };

        window.loadUsers = async () => {
            const container = document.getElementById('listUsers');
            container.innerHTML = '<div class="empty-state">Memuat data...</div>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                allUsersData = []; 
                
                querySnapshot.forEach((docSnap) => {
                    allUsersData.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                filterUsers(); 
            } catch(e) { console.error(e); }
        };

        window.renderUsers = (usersArray) => {
            const container = document.getElementById('listUsers');
            container.innerHTML = '';
            
            if (usersArray.length === 0) {
                container.innerHTML = '<div class="empty-state">Pengguna tidak ditemukan.</div>';
                return;
            }

            usersArray.forEach(data => {
                const bgRole = data.role === 'admin' ? 'rgba(0,255,136,0.05)' : 'var(--bg-input)';
                const borderRole = data.role === 'admin' ? '1px solid var(--green)' : '1px solid var(--border-color)';
                const statusBadge = data.status_akun === 'banned' ? '<span style="background:var(--red); padding:2px 5px; border-radius:3px; font-size:9px; margin-left:5px;">BANNED</span>' : '';
                
                const safeData = JSON.stringify(data).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                container.innerHTML += `
                    <div class="data-card" style="background:${bgRole}; border:${borderRole};">
                        <div class="card-header">
                            <span style="font-size: 11px;">${data.email} ${statusBadge}</span>
                            <button class="btn-logout" style="color:#fff; border-color:var(--text-muted); cursor:pointer;" onclick="openModal('${safeData}')">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                        </div>
                        <div class="card-row">
                            <span>UID</span>
                            <span class="card-val" style="font-size:10px; font-weight:normal; color:var(--text-muted);">${data.id}</span>
                        </div>
                        <div class="card-row">
                            <span>Nama</span>
                            <span class="card-val">${data.nama} ${data.role === 'admin' ? '<i class="fa-solid fa-crown" style="color:gold; margin-left:5px;"></i>' : ''}</span>
                        </div>
                        <div class="card-row">
                            <span>Saldo</span>
                            <span class="card-val" style="color:var(--green);">${formatIDR(data.saldo)}</span>
                        </div>
                    </div>
                `;
            });
        };

        window.filterUsers = () => {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortUser').value;
            const statusVal = document.getElementById('filterStatusUser').value;
            
            let filtered = allUsersData.filter(user => {
                const matchKeyword = 
                    (user.nama && user.nama.toLowerCase().includes(keyword)) || 
                    (user.email && user.email.toLowerCase().includes(keyword)) ||
                    (user.id && user.id.toLowerCase().includes(keyword));
                
                const matchStatus = (statusVal === 'all') || 
                                    (statusVal === 'banned' && user.status_akun === 'banned') || 
                                    (statusVal === 'active' && (user.status_akun === 'active' || !user.status_akun));
                
                return matchKeyword && matchStatus;
            });

            if (sortVal === 'saldo_tinggi') {
                filtered.sort((a, b) => (b.saldo || 0) - (a.saldo || 0));
            } else if (sortVal === 'saldo_rendah') {
                filtered.sort((a, b) => (a.saldo || 0) - (b.saldo || 0));
            } else if (sortVal === 'nama_az') {
                filtered.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            }

            renderUsers(filtered);
        };

        window.openModal = (dataString) => {
            const data = JSON.parse(dataString);
            document.getElementById('editUid').value = data.id;
            document.getElementById('editUidView').value = data.id; 
            document.getElementById('editNama').value = data.nama;
            document.getElementById('editEmail').value = data.email;
            document.getElementById('editSaldo').value = data.saldo || 0;
            document.getElementById('editRole').value = data.role || 'user';
            document.getElementById('editStatusAkun').value = data.status_akun || 'active'; 
            
            document.getElementById('editModal').style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('editModal').style.display = 'none';
        };

        window.saveUserData = async () => {
            const uid = document.getElementById('editUid').value;
            const newNama = document.getElementById('editNama').value;
            const newSaldo = parseFloat(document.getElementById('editSaldo').value);
            const newRole = document.getElementById('editRole').value;
            const newStatusAkun = document.getElementById('editStatusAkun').value;

            if (!confirm("Simpan perubahan untuk pengguna ini?")) return;

            try {
                await updateDoc(doc(db, "users", uid), {
                    nama: newNama,
                    saldo: newSaldo,
                    role: newRole,
                    status_akun: newStatusAkun 
                });
                alert("Data berhasil diperbarui!");
                closeModal();
                loadUsers(); 
                loadDashboard();
            } catch (error) {
                alert("Gagal memperbarui: " + error.message);
            }
        };

        window.sendResetPassword = async () => {
            const email = document.getElementById('editEmail').value;
            if (!confirm(`Kirim email reset password ke ${email}?`)) return;
            
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Tautan reset password berhasil dikirim! Pengguna bisa mengatur password baru lewat inbox emailnya.");
            } catch (error) {
                alert("Gagal mengirim email: " + error.message);
            }
        };

        // --- TAMBAHAN: FITUR HAPUS PENGGUNA (Hapus dari Firestore) ---
        window.hapusPengguna = async () => {
            const uid = document.getElementById('editUid').value;
            const email = document.getElementById('editEmail').value;

            const konfirmasi = confirm(`PERINGATAN BAHAYA!\n\nApakah Anda yakin ingin MENGHAPUS PERMANEN seluruh data profil, saldo, dan akses untuk pengguna: ${email}?\n\nTindakan ini tidak bisa dibatalkan!`);
            
            if (!konfirmasi) return;

            try {
                // Menghapus dokumen user berdasarkan UID dari koleksi "users"
                await deleteDoc(doc(db, "users", uid));
                
                alert("Berhasil! Data pengguna telah dihapus dari sistem.");
                closeModal();
                loadUsers(); // Refresh daftar user
                loadDashboard(); // Refresh statistik
            } catch (error) {
                alert("Gagal menghapus pengguna: " + error.message);
            }
        };
    </script>
</body>
</html>
