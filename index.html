<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXTRA - Trading Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #151515 0%, #000000 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-container {
            background: linear-gradient(145deg, #151515, #0a0a0a);
            border: 1px solid #222;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 140px;
            border-radius: 20px; /* Sudut melengkung agar tidak tajam */
            filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.4));
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #00ff88;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn-neon {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00cc6a, #00ff88);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 10px;
        }

        .btn-neon:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }

        .form-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        .form-footer a, .link-neon {
            color: #00ff88;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .form-footer a:hover, .link-neon:hover {
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-box">
            <!-- Menampilkan gambar logo VEXTRA dengan sudut melengkung -->
            <img src="logo.JPEG" alt="VEXTRA Logo" class="logo">
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" class="auth-form active">
            <h2>MASUK</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="Masukkan Email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="Masukkan Password">
            </div>
            <button type="submit" class="btn-neon">Masuk Dashboard</button>
            <div class="form-footer">
                <a href="#" id="lupaPassword">Lupa Password?</a>
                <p>Belum punya akun? <span id="toRegister" class="link-neon">Daftar di sini</span></p>
            </div>
        </form>

        <!-- FORM REGISTER -->
        <form id="registerForm" class="auth-form">
            <h2>DAFTAR BARU</h2>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regNama" required placeholder="Sesuai Rekening Bank">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="Email Aktif">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="Buat Password Kuat">
            </div>
            <button type="submit" class="btn-neon">Daftar & Klaim Rp150.000</button>
            <div class="form-footer">
                <p>Sudah punya akun? <span id="toLogin" class="link-neon">Masuk di sini</span></p>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvHkXznxTpdVcFMlp0pFgFYEc82Mk93jE",
            authDomain: "vextra-b30c6.firebaseapp.com",
            projectId: "vextra-b30c6",
            storageBucket: "vextra-b30c6.firebasestorage.app",
            messagingSenderId: "959668718026",
            appId: "1:959668718026:web:1b4989300a887e42dea733"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // PENGECEKAN SESI OTOMATIS (AUTO-LOGIN)
        // Jika user belum logout, langsung lempar ke dashboard/admin saat buka index.html
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    if (docSnap.data().role === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                }
            }
        });

        // Logika Pindah Form (UI)
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toRegister = document.getElementById('toRegister');
        const toLogin = document.getElementById('toLogin');

        toRegister.addEventListener('click', () => {
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
        });

        toLogin.addEventListener('click', () => {
            registerForm.classList.remove('active');
            loginForm.classList.add('active');
        });

        // LOGIKA DAFTAR (REGISTER)
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('regNama').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const btnSubmit = registerForm.querySelector('button');

            btnSubmit.innerText = "Memproses...";
            btnSubmit.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    nama: nama,
                    email: email,
                    saldo: 150000, 
                    has_deposited: false,
                    role: "user",
                    tanggal_daftar: serverTimestamp()
                });

                alert("Pendaftaran berhasil! Saldo Rp150.000 telah ditambahkan.");
                // LANGSUNG ARAHKAN KE DASHBOARD (Tidak perlu login manual lagi)
                window.location.href = "dashboard.html"; 

            } catch (error) {
                alert("Gagal mendaftar: " + error.message);
                btnSubmit.innerText = "Daftar & Klaim Rp150.000";
                btnSubmit.disabled = false;
            }
        });

        // LOGIKA MASUK (LOGIN)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btnSubmit = loginForm.querySelector('button');

            btnSubmit.innerText = "Memeriksa...";
            btnSubmit.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const docSnap = await getDoc(doc(db, "users", user.uid));

                if (docSnap.exists()) {
                    if (docSnap.data().role === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                } else {
                    alert("Data pengguna tidak ditemukan di database!");
                }
            } catch (error) {
                alert("Login gagal. Periksa email dan password Anda.");
                btnSubmit.innerText = "Masuk Dashboard";
                btnSubmit.disabled = false;
            }
        });

        // LOGIKA LUPA PASSWORD
        document.getElementById('lupaPassword').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            
            if(!email) {
                alert("Silakan ketik email Anda di kolom Email terlebih dahulu, lalu klik Lupa Password.");
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                alert("Link reset password telah dikirim ke email: " + email);
            } catch (error) {
                alert("Gagal mengirim link reset: " + error.message);
            }
        });
    </script>

</body>
</html>
